version: 2
updates:
  # Actions are SHA-pinned, so nothing bumps them without Dependabot.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 3 * * 3,6" # Wednesday and Saturday, 03:00
      timezone: "Asia/Tokyo"
    groups:
      github-actions:
        patterns: ["*"]

  # pyproject.toml + uv.lock; CI installs with `uv sync --frozen`.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 3 * * 3,6" # Wednesday and Saturday, 03:00
      timezone: "Asia/Tokyo"
    groups:
      python-dependencies:
        patterns: ["*"]
